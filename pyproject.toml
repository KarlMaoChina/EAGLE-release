[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-gbc"
version = "1.0.0"
description = "EAGLE: multimodal gallbladder cancer risk stratification from non-contrast CT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EAGLE authors" }]
keywords = ["medical-imaging", "deep-learning", "multimodal", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "nibabel>=5.0",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "torch>=2.1",
]

[project.optional-dependencies]
radiomics = ["pyradiomics==3.1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
eagle = "eagle.cli:main"

[project.urls]
Homepage = "https://github.com/KarlMaoChina/EAGLE-release"

[tool.setuptools.packages.find]
include = ["eagle*"]

[tool.setuptools.package-data]
eagle = ["assets/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
